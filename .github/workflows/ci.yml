name: CI

on:
  pull_request:
    branches: [main]

jobs:
  kotlin-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kotlin code check
        run: make code-check-kotlin

      - name: Kotlin unit tests
        run: make unit-tests-kotlin

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Web code check
        run: make code-check-web

      - name: Web unit tests
        run: make unit-tests-web
